<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Baris Parlatangiller, spatial analyst and urban planner in Frankfurt am Main. Portfolio and CV in English, German and Turkish.">
  <meta property="og:image" content="https://barisparlatangiller.github.io/Baris-Parlatangiller-CV-Portfolio/v2/og.jpg">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../v3/viewer.css">
  <title>Baris Parlatangiller · Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="name" href="./">Baris Parlatangiller</a>
    <nav><a href="#work" data-i18n="v3.work"></a><a href="#career" data-i18n="v3.career"></a><a href="../cv.html" data-keep-lang data-i18n="v2.cv"></a><a href="#contact" data-i18n="v2.contact"></a></nav>
    <div class="seg" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="tr">TR</button></div>
  </header>

  <section class="hero">
    <p class="kick" data-i18n="v2.kicker"></p>
    <h1 id="heroTitle"></h1>
    <div class="hero-row">
      <p class="lede" data-i18n="v2.lede"></p>
      <div class="ctas"><a class="btn btn-solid" href="../cv.html" data-keep-lang data-i18n="v2.cv"></a><a class="btn" id="pdf" download data-i18n="v2.pdf"></a></div>
    </div>
    <dl class="stats" id="stats"></dl>
  </section>

  <section id="work">
    <div id="featured"></div>
    <header class="sh"><h2 data-i18n="v3.index"></h2><span class="count" id="count"></span></header>
    <div class="grid" id="grid"></div>
  </section>

  <section id="career" class="career">
    <header class="sh"><h2 data-i18n="v3.career"></h2></header>
    <ol id="careerList"></ol>
  </section>

  <section class="twocol">
    <div><header class="sh"><h2 data-i18n="v3.awards"></h2></header><ol class="awards" id="awards"></ol></div>
    <div><header class="sh"><h2 data-i18n="v3.maps"></h2></header><p class="muted" data-i18n="v3.maps.p"></p><ul class="maps" id="maps"></ul></div>
  </section>

  <section id="contact" class="contact">
    <h2 data-i18n="v3.contact"></h2>
    <p data-i18n="v3.contact.p"></p>
    <div class="ctas"><a class="btn btn-solid" href="mailto:barisparlatangiller@gmail.com">barisparlatangiller@gmail.com</a><a class="btn" href="https://www.linkedin.com/in/baris-parlatangiller-015867129/" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="https://github.com/barisparlatangiller" target="_blank" rel="noopener">GitHub</a></div>
    <footer><span data-i18n="v3.versions"></span><span class="switch" id="switch"></span></footer>
  </section>
  <script src="../v3/shell.js"></script>
  <script src="../data/ui.js"></script>
  <script src="../v2/js/strings.js"></script>
  <script src="../v3/strings.js"></script>
  <script src="../data/content.js"></script>
  <script src="../data/tours.js"></script>
  <script src="../data/places.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/viewer.js"></script>
  <script src="../v3/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
